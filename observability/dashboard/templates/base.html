<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Weight Loss Agent Observability{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .sidebar {
            min-height: 100vh;
            background: #343a40;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.75);
            padding: 0.75rem 1rem;
        }
        .sidebar .nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,.1);
        }
        .sidebar .nav-link.active {
            color: #fff;
            background: #0d6efd;
        }
        .metric-card {
            transition: transform 0.2s;
        }
        .metric-card:hover {
            transform: translateY(-2px);
        }
        .status-healthy { color: #28a745; }
        .status-warning { color: #ffc107; }
        .status-error { color: #dc3545; }
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
        }
        .trace-tree {
            font-family: 'Courier New', monospace;
        }
        .trace-span {
            border-left: 2px solid #007bff;
            padding-left: 1rem;
            margin-left: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 sidebar p-0">
                <div class="p-3">
                    <h5 class="text-white mb-4">
                        <i class="fas fa-chart-line me-2"></i>
                        Observability
                    </h5>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/dashboard/">
                                <i class="fas fa-tachometer-alt me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'logs' %}active{% endif %}" href="/dashboard/logs">
                                <i class="fas fa-list me-2"></i>
                                Logs
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'traces' %}active{% endif %}" href="/dashboard/traces">
                                <i class="fas fa-project-diagram me-2"></i>
                                Traces
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'detailed_metrics' %}active{% endif %}" href="/dashboard/metrics">
                                <i class="fas fa-chart-bar me-2"></i>
                                Metrics
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'health' %}active{% endif %}" href="/dashboard/health">
                                <i class="fas fa-heartbeat me-2"></i>
                                Health
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="mt-auto p-3">
                    <small class="text-muted">
                        Last updated: <span id="last-update">-</span>
                    </small>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto px-4">
                <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        {% block page_title %}{% endblock %}
                    </h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="location.reload()">
                                <i class="fas fa-sync-alt"></i> Refresh
                            </button>
                        </div>
                    </div>
                </div>

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common JavaScript -->
    <script>
        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('last-update').textContent = now.toLocaleTimeString();
        }
        updateTimestamp();
        setInterval(updateTimestamp, 1000);

        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('Dashboard error:', e.error);
        });

        // Utility functions
        function formatDuration(ms) {
            if (ms < 1000) return `${ms.toFixed(1)}ms`;
            return `${(ms / 1000).toFixed(2)}s`;
        }

        function formatTimestamp(ts) {
            return new Date(ts).toLocaleString();
        }

        function getStatusClass(status) {
            switch(status) {
                case 'healthy': return 'status-healthy';
                case 'warning': return 'status-warning';
                case 'error': case 'unhealthy': return 'status-error';
                default: return '';
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
